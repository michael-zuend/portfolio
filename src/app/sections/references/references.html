<h2 class="outline-heading heading" data-anchor>{{ 'references.title' | translate }}</h2>

<div class="teaser">
  <h3>{{ 'references.teaser' | translate }}</h3>
  <p>{{ 'references.teaserText' | translate }}</p>
</div>

<ul class="list" #list (scroll)="onScroll()">
  @for (ref of references; track $index; let i = $index) {
    <li>
      <figure>
        <blockquote>“{{ quote(i) }}”</blockquote>
        <figcaption>
          <span class="name">{{ ref.name }}</span>
          <span class="project">{{ ref.project }}</span>
        </figcaption>
      </figure>
    </li>
  }
</ul>

<div class="dots">
  @for (ref of references; track $index; let i = $index) {
    <button
      type="button"
      [class.active]="active() === i"
      [attr.aria-current]="active() === i"
      [attr.aria-label]="'references.slide' | translate: { n: i + 1 }"
      (click)="goTo(i)"
    ></button>
  }
</div>

<app-next-arrow from="references" class="arrow" />
