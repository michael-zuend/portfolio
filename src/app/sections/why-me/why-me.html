<h2 class="outline-heading heading" data-anchor>{{ 'whyMe.title' | translate }}</h2>

<p class="text">{{ 'whyMe.text' | translate }}</p>

<h3 class="i-am">{{ 'whyMe.iAm' | translate }}<span class="colon">:</span></h3>
<ul class="facts">
  @for (fact of facts; track fact.icon) {
    <li [class]="fact.icon">
      <img [src]="'assets/icons/' + fact.icon + '.svg'" alt="" />
      <span>{{ fact.label | translate }}</span>
    </li>
  }
</ul>

<button type="button" class="btn btn--filled cta" (click)="nav.scrollTo('contact')">
  {{ 'whyMe.cta' | translate }}
</button>

<app-next-arrow from="why-me" class="arrow" />
